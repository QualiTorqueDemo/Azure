spec_version: 2
description: >
  Deploy a multiple node pools Kubernetes cluster on AKS with 
  monitoring support through Azure Log Analytics. Includes 3 worker 
  node pools with configurable Kubernetes version.
metadata:
  self-service: true
  display-name: Azure AKS with Multiple Node Pools
  icon:
    path: graphics/AKS.svg
  blueprint-labels:
    - key: hypervisor
      value: Azure
    - key: category
      value: Cloud
    - key: Terraform

inputs:
  agent:
    type: string
    description: "Select the Torque agent to deploy this environment"
    default: "aks-prod"
    allowed-values:
      - aks-prod
      - aks-dev
  Azure Location:
    type: string
    description: "Azure location for deployment"
    default: "westus2"
    allowed-values:
      - northcentralus
      - swedencentral
      - francecentral
      - northeurope
      - westus
      - westus2

outputs: {}

grains:
  multi-nodepool-aks:
    kind: terraform
    spec:
      source:
        store: Azure
        path: assets/multi-nodepool-aks
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - location: '{{ .inputs.["Azure Location"] }}'
